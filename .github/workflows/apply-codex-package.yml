name: Apply Codex package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply package
        shell: bash
        run: |
          unzip -o github-web-upload-20260831122003128.zip
          rm -f github-web-upload-20260831122003128.zip
          rm -f .github/workflows/apply-codex-package.yml
      - name: Commit published source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish requester type and Breaker Swap updates"
          git push
